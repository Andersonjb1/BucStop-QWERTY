name: Automated Selenium Testing

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - "Dev-*"
      - "Sprint-*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Start Containers
      run: |
          timeout 300s bash -c '
            env=containersLocal docker compose up -d
            echo "Waiting for containers to start..."
            docker compose wait || echo "docker compose wait timed out or failed"
          ' 
          sleep 5
          docker ps -a || true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager

    - name: Run Navigation Selenium Test
      run: |
        python ./.automatedTests/v2_0_0_NavigationTest.py

    - name: Run Play Base Games Selenium Test
      run: |
        python ./.automatedTests/v1_1_0_PlayBaseGamesTest.py

    - name: Shutdown Containers
      if: always()
      run: docker compose down
