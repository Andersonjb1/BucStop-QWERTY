name: .NET Tests (any branch, PR + post-merge)

on:
  pull_request:
    branches: ["**"]                          # Tests after pull request is made in any target branch.
    types: [opened, synchronize, reopened, ready_for_review, closed]
  push:
    branches: ["**"]                          # merge commits and direct pushes

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-tests:
    runs-on: ubuntu-latest
    # If this is a PR-closed event but NOT merged, skip; otherwise run.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }

      # discover & run (all tests for simplicity; you can drop in your affected-only logic)
      - id: list_tests
        shell: bash
        run: |
          shopt -s nullglob
          mapfile -t TESTS < <(git ls-files '*Tests.csproj')
          if [ ${#TESTS[@]} -eq 0 ]; then echo "none=true" >> $GITHUB_OUTPUT; else printf '%s\n' "${TESTS[@]}" > tests.txt; echo "none=false" >> $GITHUB_OUTPUT; fi

      - if: steps.list_tests.outputs.none == 'false'
        run: dotnet build --configuration Release --nologo

      - if: steps.list_tests.outputs.none == 'false'
        shell: bash
        run: |
          while read -r proj; do
            echo "==> dotnet test $proj"
            dotnet test "$proj" --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"
          done < tests.txt

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results-${{ github.sha }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
