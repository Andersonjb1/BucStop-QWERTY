name: .NET Tests (any branch, PR + post-merge)

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened, ready_for_review, closed]
  push:
    branches: ["**"]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-tests:
    runs-on: ubuntu-latest
    # If this is a PR-closed event but NOT merged, skip; otherwise run.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Discover test projects anywhere in the repo
      - id: list_tests
        name: Find test projects
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          # Get all csproj files tracked by git
          mapfile -t ALL_CS < <(git ls-files '**/*.csproj' || true)

          TESTS=()
          for p in "${ALL_CS[@]}"; do
            # Check for test-related package references or <IsTestProject>
            if grep -qE '<PackageReference .*Microsoft\.NET\.Test\.Sdk|<PackageReference .*xunit|<PackageReference .*xunit\.runner|<PackageReference .*MSTest\.TestAdapter|<PackageReference .*NUnit|<PackageReference .*coverlet\.collector' "$p" \
               || grep -q '<IsTestProject>true</IsTestProject>' "$p"; then
              TESTS+=("$p")
            else
              # Fallback: detect test projects by filename/path
              if [[ "$p" =~ [Tt]est ]]; then
                TESTS+=("$p")
              fi
            fi
          done

          if [ ${#TESTS[@]} -eq 0 ]; then
            echo "none=true" >> $GITHUB_OUTPUT
          else
            printf '%s\n' "${TESTS[@]}" > tests.txt
            echo "none=false" >> $GITHUB_OUTPUT
          fi

      - if: steps.list_tests.outputs.none == 'false'
        name: Display discovered tests
        run: |
          echo "Discovered test projects:"
          cat tests.txt

      - if: steps.list_tests.outputs.none == 'false'
        name: Restore and Build test projects
        shell: bash
        run: |
          set -euo pipefail
          while read -r proj; do
            echo "==> dotnet restore $proj"
            dotnet restore "$proj"
            echo "==> dotnet build $proj"
            dotnet build "$proj" --configuration Release --no-restore --nologo
          done < tests.txt

      - if: steps.list_tests.outputs.none == 'false'
        name: Run tests (one project at a time)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TestResults
          while read -r proj; do
            name=$(basename "$proj" .csproj)
            echo "==> Running tests for $name..."
            dotnet test "$proj" \
              --configuration Release \
              --no-build \
              --logger "trx;LogFileName=${name}-results.trx" \
              --results-directory "TestResults"
          done < tests.txt

      - if: always()
        name: Summarize test results
        shell: bash
        run: |
          echo "========== TEST SUMMARY =========="

          total_passed=0
          total_failed=0
          total_skipped=0

          # Loop through all TRX files
          for file in TestResults/*.trx; do
            echo ""
            echo "Results from: $file"
            # Extract counts
            passed=$(grep -o 'outcome="Passed"' "$file" | wc -l || true)
            failed=$(grep -o 'outcome="Failed"' "$file" | wc -l || true)
            skipped=$(grep -o 'outcome="NotExecuted"' "$file" | wc -l || true)

            total_passed=$((total_passed + passed))
            total_failed=$((total_failed + failed))
            total_skipped=$((total_skipped + skipped))

            if [ "$failed" -gt 0 ]; then
              echo "Failed tests:"
              # List each failed test name on its own line
              grep -oP '(?<=<UnitTestResult [^>]*outcome="Failed"[^>]*testName=")[^"]+' "$file" || true
            fi
          done

          echo ""
          echo "✅ Passed: $total_passed"
          echo "❌ Failed: $total_failed"
          echo "⚠️ Skipped: $total_skipped"
          echo "=================================="

      - if: always()
        name: Upload test results (TRX) and coverage
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results-${{ github.sha }}
          path: |
            TestResults/**/*.trx
            **/coverage.cobertura.xml
          if-no-files-found: ignore
